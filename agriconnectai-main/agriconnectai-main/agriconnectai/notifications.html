<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - AgriConnect AI</title>
  <meta name="description" content="Real-time alerts for incoming orders, APMC price shifts, AI recommendations, and account updates.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">
        <a href="index.html">
          <span style="font-size:1.4rem;">🌱</span>
          <span>AgriConnect <span style="color:var(--accent-green);">AI</span></span>
        </a>
      </div>

      <ul class="sidebar-menu">
        <li class="menu-category">Main Menu</li>
        <li class="sidebar-item">
          <a href="farmer-dashboard.html">
            <span>📊</span> Dashboard
          </a>
        </li>
        <li class="sidebar-item">
          <a href="my-products.html">
            <span>🌾</span> My Products
          </a>
        </li>
        <li class="sidebar-item">
          <a href="market-prices.html">
            <span>📈</span> Market Prices
          </a>
        </li>
        <li class="sidebar-item">
          <a href="ai-prediction.html">
            <span>🤖</span> AI Intelligence
          </a>
        </li>
        <li class="sidebar-item">
          <a href="farmer-orders.html">
            <span>📦</span> Orders
          </a>
        </li>

        <li class="menu-category">Account</li>
        <li class="sidebar-item">
          <a href="notifications.html" class="active">
            <span>🔔</span> Notifications
            <span class="item-badge notif-badge">0</span>
          </a>
        </li>
        <li class="sidebar-item">
          <a href="profile.html">
            <span>👤</span> Profile
          </a>
        </li>
        <li class="sidebar-item">
          <a href="#" class="logout-trigger">
            <span>🚪</span> Logout
          </a>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="menu-toggle" style="margin-right: 0.5rem;">☰</button>
          <h1 class="topbar-title">Notifications</h1>
        </div>
        <div class="topbar-right">
          <button id="mark-all-read-btn" class="btn btn-outline btn-sm">
            ✓ Mark All as Read
          </button>
        </div>
      </header>

      <div class="app-content">
        <div style="max-width: 820px; margin: 0 auto;">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">
                <span>🔔</span> Activity Alerts & Broadcasts
              </h3>
              <span class="badge badge-primary" id="unread-count-pill">All Notifications</span>
            </div>

            <!-- Notifications List matching Screen 16/17 -->
            <div id="notifications-container" style="display: flex; flex-direction: column; gap: 0.75rem;">
              <!-- Dynamically populated from store -->
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNotifications();

      function renderNotifications() {
        const notifs = window.store.getNotifications();
        const container = document.getElementById('notifications-container');

        if (!notifs.length) {
          container.innerHTML = `
            <div style="text-align: center; padding: 3rem 1rem;">
              <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔕</div>
              <h4>No notifications right now</h4>
              <p class="text-muted text-sm">You are all caught up on orders, market prices, and system broadcasts.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = notifs.map(n => `
          <div class="card" style="padding: 1.15rem; background: ${n.read ? '#ffffff' : '#f0fdf4'}; border-left: 4px solid ${n.read ? 'var(--border-light)' : 'var(--primary)'}; display: flex; align-items: flex-start; gap: 1rem; transition: var(--transition);">
            <div style="font-size: 1.6rem; line-height: 1; flex-shrink: 0; padding-top: 2px;">
              ${n.icon || '🔔'}
            </div>
            <div style="flex: 1;">
              <div style="font-size: 0.95rem; font-weight: ${n.read ? '500' : '700'}; color: var(--text-main); margin-bottom: 0.25rem;">
                ${n.title}
              </div>
              <div class="text-xs text-muted">
                ⏱️ ${n.time} ${!n.read ? '• <span class="badge badge-success" style="padding:1px 6px; font-size:9px;">NEW</span>' : ''}
              </div>
            </div>
          </div>
        `).join('');
      }

      document.getElementById('mark-all-read-btn').addEventListener('click', () => {
        window.store.markNotificationsRead();
        App.showToast('All notifications marked as read', 'success');
        renderNotifications();
        App.updateNotificationBadges();
      });
    });
  </script>
</body>
</html>
