<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace - Browse Farm Produce - AgriConnect AI</title>
  <meta name="description" content="Discover verified direct agricultural produce with category filters, regional sourcing, and transparent farm pricing.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">
        <a href="index.html">
          <span style="font-size:1.4rem;">🌱</span>
          <span>AgriConnect <span style="color:var(--accent-green);">AI</span></span>
        </a>
      </div>

      <ul class="sidebar-menu">
        <li class="menu-category">Main Menu</li>
        <li class="sidebar-item">
          <a href="buyer-dashboard.html">
            <span>📊</span> Dashboard
          </a>
        </li>
        <li class="sidebar-item">
          <a href="marketplace.html" class="active">
            <span>🛒</span> Marketplace
          </a>
        </li>
        <li class="sidebar-item">
          <a href="my-orders.html">
            <span>📦</span> My Orders
          </a>
        </li>
        <li class="sidebar-item">
          <a href="market-prices.html">
            <span>📈</span> Market Prices
          </a>
        </li>

        <li class="menu-category">Account</li>
        <li class="sidebar-item">
          <a href="notifications.html">
            <span>🔔</span> Notifications
            <span class="item-badge notif-badge">1</span>
          </a>
        </li>
        <li class="sidebar-item">
          <a href="profile.html">
            <span>👤</span> Profile
          </a>
        </li>
        <li class="sidebar-item">
          <a href="#" class="logout-trigger">
            <span>🚪</span> Logout
          </a>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="menu-toggle" style="margin-right: 0.5rem;">☰</button>
          <h1 class="topbar-title">Marketplace</h1>
        </div>
        <div class="topbar-right">
          <span class="badge badge-success" id="active-listings-badge">Active Listings</span>
        </div>
      </header>

      <div class="app-content">
        <!-- Filter & Search Bar matching Screen 10 -->
        <div class="filter-bar">
          <div class="filter-group" style="flex: 2; min-width: 240px;">
            <input type="text" id="search-input" class="form-control" placeholder="🔍 Search produce name (e.g. Tomato, Onion)...">
          </div>

          <div class="filter-group">
            <select id="category-filter" class="form-control">
              <option value="All Crops">All Categories</option>
              <option value="Vegetables">Vegetables</option>
              <option value="Grains & Cereals">Grains & Cereals</option>
              <option value="Fruits">Fruits</option>
            </select>
          </div>

          <div class="filter-group">
            <select id="location-filter" class="form-control">
              <option value="All Locations">All Locations</option>
              <option value="Mysuru">Mysuru</option>
              <option value="Mandya">Mandya</option>
              <option value="Bengaluru">Bengaluru</option>
            </select>
          </div>

          <div class="filter-group" style="max-width: 170px;">
            <select id="sort-filter" class="form-control">
              <option value="newest">Sort: Newest</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
            </select>
          </div>
        </div>

        <!-- Products Grid matching Screen 10 -->
        <div class="products-grid" id="marketplace-grid">
          <!-- Dynamically populated from store -->
        </div>

        <!-- Empty state placeholder (hidden by default) -->
        <div id="no-products-msg" class="card" style="display: none; text-align: center; padding: 4rem 2rem;">
          <div style="font-size: 3rem; margin-bottom: 0.75rem;">🔍</div>
          <h3>No matching crops found</h3>
          <p class="text-muted text-sm" style="margin-bottom: 1.5rem;">Try adjusting your search terms, category filters, or location parameters.</p>
          <button id="reset-filters-btn" class="btn btn-outline btn-sm">Reset All Filters</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('search-input');
      const catFilter = document.getElementById('category-filter');
      const locFilter = document.getElementById('location-filter');
      const sortFilter = document.getElementById('sort-filter');
      const grid = document.getElementById('marketplace-grid');
      const emptyMsg = document.getElementById('no-products-msg');

      function filterAndRender() {
        const filters = {
          search: searchInput.value.trim(),
          category: catFilter.value,
          location: locFilter.value
        };

        let prods = window.store.getProducts(filters);

        // Sorting
        if (sortFilter.value === 'price-low') {
          prods.sort((a, b) => a.price - b.price);
        } else if (sortFilter.value === 'price-high') {
          prods.sort((a, b) => b.price - a.price);
        }

        document.getElementById('active-listings-badge').textContent = `${prods.length} Produce Available`;

        if (prods.length === 0) {
          grid.style.display = 'none';
          emptyMsg.style.display = 'block';
        } else {
          grid.style.display = 'grid';
          emptyMsg.style.display = 'none';

          grid.innerHTML = prods.map(p => `
            <div class="product-card">
              <div class="product-image-wrap">
                <img src="${p.image}" alt="${p.name}">
                <div class="product-badge-float">
                  <span class="badge badge-success">${p.status || 'Active'}</span>
                </div>
              </div>
              <div class="product-card-body">
                <div class="product-category">${p.category}</div>
                <h3 class="product-title">${p.name}</h3>
                <div class="product-meta">
                  <span>📍 ${p.location}</span>
                  <span>•</span>
                  <span>🧑‍🌾 ${p.farmerName}</span>
                </div>
                <div class="product-price-row">
                  <div class="product-price">₹${p.price}<span class="text-sm text-muted">/${p.unit}</span></div>
                  <div class="product-stock">${p.quantity} ${p.unit} in stock</div>
                </div>
                <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                  <a href="product-details.html?id=${p.id}" class="btn btn-outline btn-sm" style="flex:1;">View Details</a>
                  <a href="place-order.html?productId=${p.id}" class="btn btn-primary btn-sm" style="flex:1;">Order</a>
                </div>
              </div>
            </div>
          `).join('');
        }
      }

      // Initial render
      filterAndRender();

      // Listeners
      searchInput.addEventListener('input', filterAndRender);
      catFilter.addEventListener('change', filterAndRender);
      locFilter.addEventListener('change', filterAndRender);
      sortFilter.addEventListener('change', filterAndRender);

      document.getElementById('reset-filters-btn').addEventListener('click', () => {
        searchInput.value = '';
        catFilter.value = 'All Crops';
        locFilter.value = 'All Locations';
        sortFilter.value = 'newest';
        filterAndRender();
      });
    });
  </script>
</body>
</html>
